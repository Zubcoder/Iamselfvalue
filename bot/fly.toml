app = 'iamselfvalue-bot'
primary_region = 'waw'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'
  PYTHONDONTWRITEBYTECODE = '1'

[deploy]
  strategy = 'rolling'

kill_signal = 'SIGTERM'
kill_timeout = '30s'

[[mounts]]
  source = 'data'
  destination = '/app/.data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
